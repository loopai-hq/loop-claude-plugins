name: identifier-gate

# Fails the build when any tracked file (except LICENSE and examples/) contains
# a company-internal identifier: cloud project ids, chat channel/user ids,
# internal hostnames or IPs, private repository names, employee or customer
# names. The concrete list of forbidden strings is deliberately not committed
# to this public repository; it is supplied through the IDENTIFIER_GATE_PATTERNS
# repository secret (an extended regex). When the secret is absent, for example
# on pull requests from forks, the script falls back to a generic pattern that
# matches the *shape* of such identifiers. See .github/scripts/identifier-gate.sh.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Grep for internal identifiers
        env:
          IDENTIFIER_GATE_PATTERNS: ${{ secrets.IDENTIFIER_GATE_PATTERNS }}
        run: bash .github/scripts/identifier-gate.sh
